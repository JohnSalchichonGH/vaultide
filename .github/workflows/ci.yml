name: CI

# Blueprint 21.7: lint (ESLint + dependency-cruiser + gitleaks) → typecheck →
# unit tests → integration tests → build → E2E. Required on every pull request;
# the production deploy depends on it.
#
# Every pull request and every manual run gets the full suite. So does a push
# to main, unless every path that differs from the last main commit to pass the
# full suite is README.md or under docs/: then only the classifier and the
# secret scan run, and the heavy jobs are skipped. The comparison starts at that
# commit, which `Full CI complete` marks, rather than at the previous push: a
# push cancels the main run before it, so a docs commit on top of a code commit
# whose run was cancelled still gets the full suite.
# scripts/ci/classify-main-change.mjs decides, and anything it cannot prove is
# documentation gets the full suite. A green run on main, light or full, still
# releases through deploy-production.yml, so production stays the tip of main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. The classifier adds `actions: read` for itself.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Supply-chain: pnpm refuses dependencies younger than three days (17.3).
  CI: 'true'
  # The commit every job checks out, tests and builds. A pull request is tested
  # at its own head, never at GitHub's synthetic merge commit, so the SHA under
  # review is the SHA that CI ran and the one that may later fast-forward main;
  # a push or a manual run tests the event's own commit.
  CI_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Earlier runs of this workflow and their jobs, to find the full-CI anchor.
      actions: read
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
      anchor: ${{ steps.classify.outputs.anchor }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
          # The anchor can be any earlier commit on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the classifier
        run: node --test scripts/ci/classify-main-change.test.mjs

      - name: Full suite or docs only
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/classify-main-change.mjs

  secrets:
    name: Secret scan
    # Every run, light or full: a docs-only change can leak a secret too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
          fetch-depth: 0

      - name: Scan for secrets
        # Run gitleaks directly rather than through its action: the action scans
        # `<base>^..<head>`, which does not resolve on a repository's first push,
        # and a full-history scan is stricter anyway.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif

  quality:
    name: Lint, boundaries and types
    needs: classify
    # The heavy jobs are skipped only on a positive docs-only answer; an empty
    # or unexpected output runs them.
    if: needs.classify.outputs.full_ci != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: ESLint
        run: pnpm -r run lint

      - name: Module boundaries (section 19)
        run: pnpm run lint:boundaries

      - name: Typecheck
        run: pnpm -r run typecheck

  unit:
    name: Unit and property tests
    needs: classify
    if: needs.classify.outputs.full_ci != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm -r run test:unit

      - name: Coverage gate for the finance engines (>= 95%)
        run: pnpm --filter @vaultide/finance exec vitest run --coverage

  database:
    name: Fresh database, roles and backup
    needs: classify
    if: needs.classify.outputs.full_ci != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vaultide_admin
          POSTGRES_PASSWORD: vaultide_admin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaultide_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL_ADMIN: postgres://vaultide_admin:vaultide_admin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL 18 client tools
        # Ubuntu's own repositories stop at 16, so pull the client from PGDG to
        # match the Postgres version Neon runs in production.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSfL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc             https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "PGBIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      # Provisioning exactly as an operator does it (22.2), from an empty
      # database: admin bootstrap → migrations as app_owner → seed.
      - name: Provision a database from zero
        env:
          DATABASE_URL_ADMIN: postgres://vaultide_admin:vaultide_admin@127.0.0.1:5432/vaultide_ci
          APP_OWNER_PASSWORD: ci_owner_password
          APP_USER_PASSWORD: ci_user_password
          APP_BACKUP_PASSWORD: ci_backup_password
        run: |
          PGPASSWORD=vaultide_admin "$PGBIN/psql" \
            -h 127.0.0.1 -U vaultide_admin -d postgres \
            -c 'CREATE DATABASE vaultide_ci'
          pnpm db:bootstrap
          DATABASE_URL_DIRECT_OWNER="postgres://app_owner:ci_owner_password@127.0.0.1:5432/vaultide_ci" pnpm db:migrate
          DATABASE_URL_DIRECT_OWNER="postgres://app_owner:ci_owner_password@127.0.0.1:5432/vaultide_ci" pnpm db:seed-currencies
          # Idempotent: a second bootstrap changes nothing.
          pnpm db:bootstrap

      # Role assertions, RLS behaviour, currency seed and the verified encrypted
      # backup, each against its own freshly provisioned database.
      - name: Integration, role and backup tests
        run: pnpm run test:integration

  build-and-e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    needs: [classify, quality, unit]
    if: needs.classify.outputs.full_ci != 'false'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vaultide_admin
          POSTGRES_PASSWORD: vaultide_admin
          POSTGRES_DB: vaultide_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaultide_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare the E2E database
        env:
          DATABASE_URL_ADMIN: postgres://vaultide_admin:vaultide_admin@127.0.0.1:5432/vaultide_e2e
          APP_OWNER_PASSWORD: e2e_owner_password
          APP_USER_PASSWORD: e2e_user_password
          APP_BACKUP_PASSWORD: e2e_backup_password
        run: |
          pnpm db:bootstrap
          DATABASE_URL_DIRECT_OWNER="postgres://app_owner:e2e_owner_password@127.0.0.1:5432/vaultide_e2e" pnpm db:migrate
          DATABASE_URL_DIRECT_OWNER="postgres://app_owner:e2e_owner_password@127.0.0.1:5432/vaultide_e2e" pnpm db:seed-currencies

      - name: Build
        env:
          VAULTIDE_VERSION: ${{ env.CI_SHA }}
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm --filter @vaultide/e2e exec playwright install --with-deps chromium webkit

      - name: End-to-end (desktop and mobile)
        env:
          DATABASE_URL: postgres://app_user:e2e_user_password@127.0.0.1:5432/vaultide_e2e
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  full-ci-complete:
    # The anchor the next push to main is measured against, found by this name
    # (scripts/ci/classify-main-change.mjs). It runs only when every job of the
    # full suite ran and passed: on a light run the heavy jobs are skipped, and
    # skipped is not success, so this is skipped too.
    name: Full CI complete
    runs-on: ubuntu-latest
    needs: [classify, secrets, quality, unit, database, build-and-e2e]
    if: >-
      needs.classify.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.database.result == 'success' &&
      needs.build-and-e2e.result == 'success'
    steps:
      - run: echo "Every job of the full suite passed for ${CI_SHA}."
