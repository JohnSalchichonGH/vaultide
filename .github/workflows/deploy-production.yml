name: Deploy production

# Blueprint 22.3: CI green → migrations as `app_owner` over the direct endpoint
# → trigger the Vercel production deploy hook. Vercel's own automatic production
# deploy is disabled, so the schema is always ahead of the code that needs it.

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, then deploy
    runs-on: ubuntu-latest
    # Only after a green CI run on main.
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The owner credential exists only here — never in the Vercel runtime.
      - name: Apply migrations as app_owner
        env:
          DATABASE_URL_DIRECT_OWNER: ${{ secrets.DATABASE_URL_DIRECT_OWNER }}
        run: pnpm db:migrate

      - name: Seed reference currencies
        env:
          DATABASE_URL_DIRECT_OWNER: ${{ secrets.DATABASE_URL_DIRECT_OWNER }}
        run: pnpm db:seed-currencies

      - name: Trigger the Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "No deploy hook configured; skipping (set VERCEL_DEPLOY_HOOK_URL)."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "${VERCEL_DEPLOY_HOOK_URL}")
          echo "deploy hook responded ${status}"
          cat response.json
          [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]

      - name: Verify the new deployment is live and healthy
        env:
          APP_URL: ${{ vars.APP_URL }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "No APP_URL configured; skipping the health check."
            exit 0
          fi

          # /api/health reports the commit it was built from, so the gate can
          # wait for *this* release rather than accepting whatever was already
          # serving — which the previous version did, and would have passed even
          # if the new build had failed.
          expected="${RELEASED_SHA:0:7}"
          echo "waiting for ${expected} to be live at ${APP_URL}"

          for attempt in $(seq 1 40); do
            status=$(curl -sS -o health.json -w '%{http_code}' "${APP_URL}/api/health" || true)
            if [ "${status}" = "200" ]; then
              live=$(node -e "process.stdout.write(String(require('./health.json').version ?? ''))")
              if [ "${live}" = "${expected}" ]; then
                cat health.json
                echo ""
                echo "${expected} is live and healthy after ${attempt} attempt(s)"
                exit 0
              fi
              echo "  attempt ${attempt}: healthy, still serving ${live}"
            else
              echo "  attempt ${attempt}: HTTP ${status}"
            fi
            sleep 10
          done

          echo ""
          echo "Timed out waiting for ${expected} to go live."
          echo "Either the Vercel build failed, or VAULTIDE_VERSION is set in the"
          echo "runtime environment and is masking the deployed commit."
          cat health.json || true
          exit 1
